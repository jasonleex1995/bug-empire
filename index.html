<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bug Empire</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, #1e3324 0%, transparent 55%),
          linear-gradient(180deg, #0a1210 0%, #0c1410 40%, #080e0a 100%);
        color: #e6f0e4;
        font-family: 'IBM Plex Sans KR', 'Noto Sans KR', sans-serif;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        image-rendering: auto;
        max-width: 100vw;
        max-height: 100vh;
        border-radius: 4px;
        box-shadow:
          0 0 0 1px rgba(93, 224, 192, 0.08),
          0 24px 80px rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="game" width="1280" height="720"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
