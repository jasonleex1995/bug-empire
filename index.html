<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bug Empire</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Galmuri: Korean pixel font. Press Start 2P: English pixel accent. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background:
          radial-gradient(ellipse 70% 45% at 50% 20%, #3a3028 0%, transparent 55%),
          linear-gradient(180deg, #101820 0%, #1a1814 45%, #0c0a0a 100%);
        color: #e6f0e4;
        font-family: 'Galmuri14', 'Galmuri11', monospace;
        overflow: hidden;
        image-rendering: pixelated;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        max-width: 100vw;
        max-height: 100vh;
        border-radius: 0;
        box-shadow:
          0 0 0 2px rgba(232, 184, 74, 0.12),
          0 24px 80px rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="game" width="1280" height="720"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
